site_name: PraisonAI Bench
site_url: https://bench.praison.ai
site_description: Simple LLM Benchmarking Tool using PraisonAI Agents

repo_name: MervinPraison/PraisonAIBench
repo_url: https://github.com/MervinPraison/PraisonAIBench

theme:
  name: !ENV [PRAISONAI_THEME, material]
  palette:
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - admonition
  - tables

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Features:
    - Test Suites: features/test-suites.md
    - Evaluation System: features/evaluation.md
    - HTML Extraction: features/html-extraction.md
    - Cost & Token Tracking: features/cost-tracking.md
    - Reports & Export: features/reports.md
    - Plugin System: features/plugins.md
