schemaVersion: 1
site:
  title: PraisonAI Bench
  ui: shadcn
  theme:
    preset: paper
    radius: md
    mode: system
  description: Simple LLM Benchmarking Tool using PraisonAI Agents
seo:
  siteUrl: https://bench.praison.ai
navigation:
  tabs:
  - tab: Docs
    groups:
    - group: Get started
      pages:
      - index
      icon: rocket
    - group: Getting Started
      pages:
      - getting-started/installation
      - getting-started/quick-start
      icon: rocket
      prefix: getting-started
    - group: Features
      pages:
      - features/test-suites
      - features/evaluation
      - features/html-extraction
      - features/cost-tracking
      - features/reports
      - features/plugins
      icon: book-open
      prefix: features
navbar:
  primary:
    type: button
    label: Quick start
    href: /docs/getting-started/installation
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/PraisonAIBench
footer:
  socials:
    github: https://github.com/MervinPraison/PraisonAIBench
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
    nav:
      mode: manual
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: PraisonAI Bench
  footer_main:
    type: Footer
    props:
      text: PraisonAI Bench
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
