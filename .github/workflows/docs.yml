name: Docs
on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'aiui.template.yaml']
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PraisonAI UI
        run: pip install aiui
      - name: Build docs
        run: |
          aiui build --config aiui.template.yaml --output site --minify
          if [ -f CNAME ]; then cp CNAME site/CNAME; fi
          if [ -f docs/CNAME ]; then cp docs/CNAME site/CNAME; fi
          if [ -f mkdocs-docs/CNAME ]; then cp mkdocs-docs/CNAME site/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
